apiVersion: apps/v1
kind: Deployment
metadata:
  name: scaletestapp
  namespace: sprint8
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scaletestapp
  template:
    metadata:
      labels:
        app: scaletestapp
    spec:
      containers:
      - name: scaletestapp
        image: ghcr.io/yandex-practicum/scaletestapp:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        resources:
          requests:
            memory: 15Mi
            cpu: 100m
          limits:
            memory: 60Mi
            cpu: 300m
      restartPolicy: Always